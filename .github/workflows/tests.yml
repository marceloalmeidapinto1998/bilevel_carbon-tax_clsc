name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    # Runs only the "not slow" subset (see pyproject.toml's pytest markers): every test marked
    # `gurobi` is also marked `slow` in this suite, so this job never calls gurobipy's optimizer
    # and needs no Gurobi licence. Solver/campaign correctness tests (`-m slow`) stay a local,
    # licensed-machine responsibility -- see README.md's "Tests" section.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by pyproject.toml's requires-python; 3.14 matches the
        # project's actual development environment (.venv_py314_gurobi13).
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable, dev extras)
        run: pip install -e .[dev]

      - name: Run fast test suite
        run: python -m pytest -m "not slow" -v
